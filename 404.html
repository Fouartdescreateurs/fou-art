
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirection...</title>
    <script>
      const segment = 1;
      const l = window.location;

      const repo = "/fou-art";
      const path = l.pathname.startsWith(repo)
        ? l.pathname.slice(repo.length)
        : l.pathname;

      const redirect =
        repo +
        "/?p=" +
        encodeURIComponent(path + l.search) +
        l.hash;

      l.replace(redirect);
    </script>
  </head>
  <body>
    Redirection...
  </body>
</html>
